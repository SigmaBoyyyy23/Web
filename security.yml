name: AFBI #10 Security & Quality Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  security-scan:
    name: Run Automated Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies (if any)
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found, skipping npm install."
          fi

      - name: Run NPM Vulnerability Audit
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high || echo "Audit completed with warnings."
          else
            echo "Skipping audit, static HTML project."
          fi
